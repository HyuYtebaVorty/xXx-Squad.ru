<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoZm3zdie</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-color: black;
  }

  #background {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw;
    height: 100vh;
    background: url('4ef5b8e5-c818-4df6-81db-dd620048426f.gif') center center / cover no-repeat;
    filter: blur(4.5px);
    transition: filter 0.5s ease;
    z-index: 1;
  }

  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 2;
    pointer-events: auto;
    color: white;
    cursor: pointer;
    user-select: none;
  }

  #instruction {
    color: #ff0000;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 2px #a00;
  }

  #bioContent {
    margin-top: 30px;
    font-size: 20px;
    text-align: center;
    max-width: 400px;
    display: none;
    user-select: none;
    text-shadow: 0 0 6px black;
  }

  #acrylicBlock {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 24px;
    padding: 60px 70px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
    color: white;
    z-index: 10;
    user-select: none;
    min-width: 23cm;
    max-width: 90vw;
  }

  #acrylicBlock img.avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.7);
  }

  #acrylicBlock .nickname {
    font-size: 36px;
    font-weight: 700;
    text-shadow: 0 0 8px black;
    white-space: nowrap;
  }

  #acrylicBlock .subtitle {
    font-size: 18px;
    text-align: center;
    line-height: 1.4;
    color: white;
    text-shadow: 0 0 6px black;
    user-select: text;
  }

  #acrylicBlock .subtitle a {
    color: #aabbff;
    text-decoration: underline;
  }

  .behind-you {
    font-size: 18px;
    margin-top: 5px;
    color: red;
    font-weight: bold;
    text-shadow: 0 0 5px black;
  }

  .mini-icons {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    justify-content: center;
  }

  .mini-icons a img {
    width: 30px !important;
    height: 30px !important;
    object-fit: contain;
    filter: drop-shadow(0 0 2px black);
    transition: transform 0.3s ease;
  }

  .mini-icons a img:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 5px #00afff);
  }
</style>
</head>
<body>

<div id="background"></div>

<div id="overlay">
  <div id="instruction">Нажми нах</div>
  <div id="bioContent">
    <h1></h1>
    <p></p>
  </div>
</div>

<div id="acrylicBlock">
  <img src="01ab81c6-5b06-44a2-93c8-002b5237ba1f.webp" alt="Аватар" class="avatar" />
  <div class="nickname">VOZM3ZD1E</div>
  <div class="subtitle">
    Owner-Legion Of Darkness<br />
    <a href="https://discord.gg/SB9NZcPEwP" target="_blank" rel="noopener noreferrer">https://discord.gg/SB9NZcPEwP</a>
  </div>
  <div class="behind-you">ЗА ТВОЕЙ СПИНОЙ</div>
  <div class="mini-icons">
    <a href="https://t.me/LegionOfDarnkess" target="_blank" rel="noopener noreferrer">
      <img src="telegram.png" alt="Telegram">
    </a>
    <a href="https://discord.gg/SB9NZcPEwP" target="_blank" rel="noopener noreferrer">
      <img src="discord.png" alt="Discord">
    </a>
  </div>
</div>

<audio id="audio" src="GET AWAY.mp3"></audio>

<script>
  const overlay = document.getElementById('overlay');
  const bio = document.getElementById('bioContent');
  const instruction = document.getElementById('instruction');
  const background = document.getElementById('background');
  const audio = document.getElementById('audio');
  const acrylicBlock = document.getElementById('acrylicBlock');

  overlay.addEventListener('click', () => {
    background.style.filter = 'none';
    bio.style.display = 'block';
    instruction.style.display = 'none';
    acrylicBlock.style.display = 'flex';

    audio.play();

    function restartGif() {
      const gifUrlBase = '4ef5b8e5-c818-4df6-81db-dd620048426f.gif';
      const newUrl = gifUrlBase + '?v=' + new Date().getTime();
      background.style.backgroundImage = `url('${newUrl}')`;
    }

    restartGif();

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play();
      restartGif();
    });

    overlay.style.pointerEvents = 'none';
  });
</script>

</body>
</html>
